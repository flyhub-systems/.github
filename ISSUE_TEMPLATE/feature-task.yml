name: Feature / Task
description: Plan a feature, technical task, documentation change, refactor, infrastructure work, or research/spike.
title: ""
body:
  - type: markdown
    attributes:
      value: |
        Use this template for Parent Issues, Sub-issues, or independent technical work.

        When this Issue belongs to a larger delivery, link it to the appropriate Parent Issue using GitHub Sub-issues.

        Keep the Issue focused on the delivery contract. Routine implementation details do not need to be prescribed unless they are required by an accepted decision.

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Explain the problem, current state, and why this work is needed.
      placeholder: What problem or need led to this work?
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: State the outcome this Issue must achieve.
      placeholder: What should be true when this Issue is complete?
    validations:
      required: true

  - type: textarea
    id: requirements
    attributes:
      label: Requirements
      description: List the behavior or deliverables that are required.
      placeholder: |
        - Requirement 1
        - Requirement 2
    validations:
      required: true

  - type: textarea
    id: architecture_constraints
    attributes:
      label: Architecture constraints
      description: Record accepted architectural, security, public API, schema, or repository constraints that apply. Use N/A when none apply.
      placeholder: |
        - Follow ADR-...
        - Do not introduce...
        - N/A
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: Define observable conditions that prove the work is complete.
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: Explicitly state related work that must not be included.
      placeholder: |
        - Future capability...
        - Unrelated refactor...
        - N/A
    validations:
      required: true

  - type: textarea
    id: tests
    attributes:
      label: Tests / verification
      description: Describe how the Issue should be verified. Use N/A only when testing is genuinely not applicable.
      placeholder: |
        - Unit tests...
        - Integration tests...
        - Manual verification...
    validations:
      required: true

  - type: checkboxes
    id: readiness
    attributes:
      label: Readiness
      options:
        - label: The scope is small enough to implement and review independently.
          required: true
        - label: Any required human decision has already been made or is explicitly identified as a decision gate.
          required: true
