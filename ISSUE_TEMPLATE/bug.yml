name: Bug
description: Report incorrect or unexpected behavior in an existing FlyHub capability.
title: ""
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Keep the report focused on reproducible behavior and expected outcome.

        If this bug belongs to a larger delivery, link it to the appropriate Parent Issue using GitHub Sub-issues. Otherwise it may remain an independent Issue.

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Describe where the problem occurs and any relevant background.
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual behavior
      description: Describe what currently happens.
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
      description: Describe what should happen instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reliable sequence that reproduces the problem.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Explain who or what is affected and the severity of the problem.
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Record relevant accepted contracts or constraints that the fix must preserve. Use N/A when none apply.
      placeholder: |
        - Public API behavior...
        - ADR...
        - N/A
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: Define observable conditions that prove the bug is fixed.
      placeholder: |
        - [ ] Reproduction no longer fails
        - [ ] Regression coverage exists
    validations:
      required: true

  - type: textarea
    id: tests
    attributes:
      label: Tests / verification
      description: Describe the regression coverage and other verification required.
    validations:
      required: true
